<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Forest Swing</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#020b0d;color:#fff;font-family:monospace}
    #game{display:block;width:100vw;height:100vh;image-rendering:pixelated;touch-action:none}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020b0d;color:#d9ffd7;font-size:clamp(18px,4vw,28px);letter-spacing:.04em;z-index:20;transition:opacity .55s ease}
    #loading.is-hidden{opacity:0;pointer-events:none}
    #chapter{position:fixed;left:50%;top:max(20px,env(safe-area-inset-top));transform:translateX(-50%);width:min(86vw,680px);text-align:center;color:#f4ffe7;font-size:clamp(16px,3.2vw,24px);font-weight:bold;line-height:1.3;text-shadow:0 3px 0 #04100d,0 0 14px #8dffbd;opacity:0;z-index:6;pointer-events:none}
    #landing{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(transparent 45%,rgba(1,8,10,.72));z-index:10;box-sizing:border-box}
    #landing.is-visible{display:flex}
    .landing-card{width:min(620px,92vw);padding:18px 20px;background:rgba(7,18,18,.92);border:3px solid #bcefa8;border-radius:16px;text-align:center;box-shadow:0 12px 40px #000b}
    .landing-card h1{margin:0 0 8px;color:#f5ffd9;font-size:clamp(22px,5vw,30px)}
    .landing-card p{margin:0 0 14px;color:#d5f5e0;font-size:clamp(14px,3.5vw,18px);line-height:1.4}
    .landing-card button{margin:5px;padding:11px 16px;border:2px solid #bcefa8;border-radius:10px;background:#173a32;color:#f5ffd9;font:700 15px monospace;cursor:pointer}
    .landing-card button.secondary{background:#181d1d;border-color:#81aaa1;color:#d6ece7}
    #sceneStatus{position:fixed;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
    @media (prefers-reduced-motion:reduce){#loading{transition:none}}
  </style>
</head>
<body>
  <canvas id="game" aria-label="Ashton and Tanima automatically web-swinging together through eight forest clearings"></canvas>
  <div id="loading">Growing the forest…</div>
  <div id="chapter" aria-hidden="true"></div>
  <div id="sceneStatus" aria-live="polite">Loading the forest swing.</div>
  <section id="landing" aria-label="Forest landing complete">
    <div class="landing-card">
      <h1>The path ahead is waiting…</h1>
      <p>You both made it through the forest. The next location can connect to this clearing when it is ready.</p>
      <button id="replaySwing" type="button">Swing again</button>
      <button id="returnHome" class="secondary" type="button">Back home</button>
    </div>
  </section>
  <script src="js/music.js"></script>
  <script src="js/outfit-loader.js"></script>
  <script src="js/forest-swing.js"></script>
</body>
</html>
